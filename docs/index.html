<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRV · Item Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0c0f;
  --surface:   #111318;
  --surface2:  #181c23;
  --border:    #252b35;
  --border2:   #2e3545;
  --text:      #e8eaf0;
  --muted:     #7a8296;
  --dim:       #4a5268;
  --accent:    #e8540a;
  --accent-s:  rgba(232,84,10,.12);
  --green:     #22c55e;  --green-bg:  rgba(34,197,94,.1);
  --amber:     #f59e0b;  --amber-bg:  rgba(245,158,11,.1);
  --red:       #ef4444;  --red-bg:    rgba(239,68,68,.1);
  --blue:      #60a5fa;  --blue-bg:   rgba(96,165,250,.1);
  --purple:    #a78bfa;  --purple-bg: rgba(167,139,250,.1);
  --mono:      'DM Mono', monospace;
  --sans:      'Archivo', system-ui, sans-serif;
  --r:         6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;line-height:1.5;}
.app{display:flex;flex-direction:column;min-height:100vh;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:1.5rem;height:52px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;}
.logo-mark{width:26px;height:26px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;letter-spacing:-.5px;}
.logo-text{font-size:13px;font-weight:600;color:var(--text);letter-spacing:.06em;text-transform:uppercase;}
.h-sep{width:1px;height:20px;background:var(--border);}
.h-title{font-size:13px;color:var(--muted);}
.h-right{margin-left:auto;display:flex;align-items:center;gap:.75rem;}
.freshness{display:flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:11px;color:var(--muted);}
.f-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* FILTER BAR */
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;}
.loc-tabs{display:flex;gap:2px;background:var(--bg);border-radius:var(--r);padding:2px;}
.loc-tab{padding:.28rem .85rem;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);border:none;background:transparent;transition:all .15s;font-family:var(--sans);}
.loc-tab.active{background:var(--surface2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4);}
.f-sep{width:1px;height:16px;background:var(--border);}
select,input[type=text]{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--r);padding:.28rem .7rem;font-size:12px;font-family:var(--sans);outline:none;transition:border-color .15s;}
select:focus,input:focus{border-color:var(--border2);}
select option{background:var(--surface);}
.srch{position:relative;}
.srch input{padding-left:2rem;width:180px;}
.srch-icon{position:absolute;left:.55rem;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none;}
.f-count{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--muted);}

/* SUMMARY */
.summary{padding:1rem 1.5rem;display:flex;gap:.75rem;flex-wrap:wrap;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.6rem 1rem;flex:1;min-width:100px;}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.2rem;}
.stat-val{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1;}
.s-all .stat-val{color:var(--text);}
.s-ok  .stat-val{color:var(--green);}
.s-in  .stat-val{color:var(--blue);}
.s-out .stat-val{color:var(--red);}
.s-emb .stat-val{color:var(--purple);}

/* TABLE */
.tbl-wrap{flex:1;overflow:auto;padding:0 1.5rem 2rem;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{position:sticky;top:0;background:var(--bg);padding:.5rem .75rem;text-align:left;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--muted);}
thead th.sorted{color:var(--text);}
thead th.r{text-align:right;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:hover{background:var(--surface);}
tbody tr.expanded,tbody tr.detail-row{background:var(--surface);}
tbody tr.detail-row:hover{background:var(--surface2);}
td{padding:.55rem .75rem;vertical-align:middle;white-space:nowrap;}
td.r{text-align:right;font-family:var(--mono);font-size:12px;}
.sku-code{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;}
.sku-name{font-weight:500;color:var(--text);display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
.cls-pill{font-size:10px;padding:.15rem .5rem;border-radius:20px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);white-space:nowrap;}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:.2rem .55rem;border-radius:20px;white-space:nowrap;}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;}
.badge.in_stock   {color:var(--green); background:var(--green-bg);}  .badge.in_stock::before{background:var(--green);}
.badge.out_of_stock{color:var(--red);  background:var(--red-bg);}    .badge.out_of_stock::before{background:var(--red);}
.badge.incoming   {color:var(--blue);  background:var(--blue-bg);}   .badge.incoming::before{background:var(--blue);animation:pulse 1.5s ease-in-out infinite;}
.badge.embargoed  {color:var(--purple);background:var(--purple-bg);} .badge.embargoed::before{background:var(--purple);}
.badge.partial    {color:var(--amber); background:var(--amber-bg);}  .badge.partial::before{background:var(--amber);}
.pos{color:var(--green);}
.neg{color:var(--red);}
.dim{color:var(--dim);}
.muted{color:var(--muted);}
.mono{font-family:var(--mono);}
.c-name{font-family:var(--mono);font-size:11px;color:var(--muted);}
.c-po{font-size:10px;color:var(--dim);}
.xbtn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--dim);cursor:pointer;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s;}
.xbtn:hover{border-color:var(--border2);color:var(--muted);}
.xbtn.open{border-color:var(--accent);color:var(--accent);background:var(--accent-s);}

/* STAIRCASE DETAIL */
.detail-cell{padding:.75rem 1rem .75rem 2.5rem;}
.sc-title{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
.sc-table{width:100%;border-collapse:collapse;font-size:11px;}
.sc-table th{color:var(--dim);text-align:right;padding:.25rem .5rem;font-weight:500;font-size:10px;border-bottom:1px solid var(--border);}
.sc-table th:first-child{text-align:left;}
.sc-table td{padding:.25rem .5rem;font-family:var(--mono);text-align:right;border-bottom:1px solid var(--border);}
.sc-table td:first-child{text-align:left;font-family:var(--sans);color:var(--muted);}
.sc-table tr:last-child td{border-bottom:none;}
.sc-table .np{color:var(--green);font-weight:500;}
.sc-table .nz{color:var(--red);}
.bar-wrap{height:2px;background:var(--border);border-radius:1px;margin-top:.15rem;}
.bar-fill{height:2px;background:var(--accent);border-radius:1px;}

/* STATES */
.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;padding:4rem;color:var(--dim);}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
.err-box{background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r);padding:.75rem 1rem;color:var(--red);font-size:12px;max-width:400px;text-align:center;}
.empty-row td{text-align:center;padding:3rem;color:var(--dim);}
</style>
</head>
<body>
<div class="app">

<header>
  <a class="logo" href="#">
    <div class="logo-mark">G</div>
    <span class="logo-text">Grivel</span>
  </a>
  <div class="h-sep"></div>
  <span class="h-title">Item Availability</span>
  <div class="h-right">
    <div class="freshness">
      <div class="f-dot"></div>
      <span id="freshness-text">loading…</span>
    </div>
  </div>
</header>

<div class="filter-bar">
  <div class="loc-tabs">
    <button class="loc-tab active" id="tab-v" onclick="setLoc('verrayes')">VERRAYES</button>
    <button class="loc-tab"        id="tab-u" onclick="setLoc('usa3pl')">USA · 3PL</button>
  </div>
  <div class="f-sep"></div>
  <select id="lc-sel" onchange="filter()">
    <option value="Active">Active</option>
    <option value="">All lifecycles</option>
    <option value="Discontinued">Discontinued</option>
  </select>
  <select id="st-sel" onchange="filter()">
    <option value="">All statuses</option>
    <option value="in_stock">In Stock</option>
    <option value="incoming">Incoming</option>
    <option value="out_of_stock">Out of Stock</option>
    <option value="embargoed">Embargoed</option>
  </select>
  <div class="srch">
    <span class="srch-icon">⌕</span>
    <input type="text" id="srch" placeholder="Search SKU or name…" oninput="filter()">
  </div>
  <span class="f-count" id="f-count"></span>
</div>

<div id="content">
  <div class="state-wrap"><div class="spinner"></div><span>Loading availability data…</span></div>
</div>

</div>
<script>
'use strict';
var all=[], shown=[], loc='verrayes', sk='item_name', sd=1, open_=new Set();

async function boot(){
  try{
    const base=location.pathname.replace(/\/[^/]*$/,'/');
    const [av,me]=await Promise.all([fetch(base+'availability.json').then(r=>r.json()),fetch(base+'metadata.json').then(r=>r.json())]);
    all=av.items||[];
    if(me.refreshed_at){
      const d=new Date(me.refreshed_at);
      const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('freshness-text').textContent=
        'Data as of '+d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear()+
        ' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }
    filter();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="state-wrap"><div class="err-box">Could not load data.<br><small>'+esc(e.message)+'</small></div></div>';
  }
}

function setLoc(l){
  loc=l;
  document.getElementById('tab-v').classList.toggle('active',l==='verrayes');
  document.getElementById('tab-u').classList.toggle('active',l==='usa3pl');
  open_.clear();filter();
}

function filter(){
  var lc=document.getElementById('lc-sel').value;
  var st=document.getElementById('st-sel').value;
  var q=document.getElementById('srch').value.toLowerCase().trim();
  shown=all.filter(function(i){
    if(i.location!==loc)return false;
    if(lc&&i.lifecycle!==lc)return false;
    if(st&&i.status!==st)return false;
    if(q&&!i.item_name.toLowerCase().includes(q)&&!(i.item_display_name||'').toLowerCase().includes(q))return false;
    return true;
  });
  shown.sort(function(a,b){
    var av=a[sk],bv=b[sk];
    if(av==null)av=sd>0?Infinity:-Infinity;
    if(bv==null)bv=sd>0?Infinity:-Infinity;
    if(typeof av==='string')return av.localeCompare(bv)*sd;
    return(av-bv)*sd;
  });
  var total=all.filter(function(i){return i.location===loc;}).length;
  document.getElementById('f-count').textContent=shown.length+' / '+total+' SKUs';
  render();
}

function sort_(k){
  if(sk===k)sd*=-1;else{sk=k;sd=1;}
  filter();
}

function render(){
  var s={total:shown.length,in_stock:0,incoming:0,out_of_stock:0,embargoed:0};
  shown.forEach(function(i){if(s[i.status]!==undefined)s[i.status]++;});
  var rows='';
  if(shown.length===0){
    rows='<tr class="empty-row"><td colspan="10">No items match the current filters</td></tr>';
  }else{
    shown.forEach(function(i){rows+=row(i);});
  }
  function th(k,lbl,cls){
    var arrow=sk===k?(sd>0?' ↑':' ↓'):'';
    return'<th class="'+(sk===k?'sorted ':''+(cls||''))+'" onclick="sort_(\''+k+'\')">'+lbl+arrow+'</th>';
  }
  document.getElementById('content').innerHTML=
    '<div class="summary">'+
    '<div class="stat s-all"><div class="stat-label">Total SKUs</div><div class="stat-val">'+s.total+'</div></div>'+
    '<div class="stat s-ok"><div class="stat-label">In Stock</div><div class="stat-val">'+s.in_stock+'</div></div>'+
    '<div class="stat s-in"><div class="stat-label">Incoming</div><div class="stat-val">'+s.incoming+'</div></div>'+
    '<div class="stat s-out"><div class="stat-label">Out of Stock</div><div class="stat-val">'+s.out_of_stock+'</div></div>'+
    '<div class="stat s-emb"><div class="stat-label">Embargoed</div><div class="stat-val">'+s.embargoed+'</div></div>'+
    '</div>'+
    '<div class="tbl-wrap"><table>'+
    '<thead><tr>'+
    th('item_name','SKU / Name')+
    '<th>Class</th>'+
    th('status','Status')+
    th('available_today','Avail Today','r')+
    th('open_demand_today','Open Demand','r')+
    th('max_buildable_today','Max Build','r')+
    th('next_available_date','Next Avail')+
    '<th class="r">Next Qty</th>'+
    '<th>Top Constraint</th>'+
    '<th></th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function row(i){
  var isOpen=open_.has(i.item_id);
  var lc=(i.limiting_components||[])[0];
  var nd=i.next_available_date?fd(i.next_available_date):'<span class="dim">—</span>';
  var nq=i.next_available_qty!=null
    ?'<span class="'+(i.next_available_qty>0?'pos':'dim')+'">'+i.next_available_qty+'</span>'
    :'<span class="dim">—</span>';
  var ch=lc
    ?'<div class="c-name">'+esc(lc.item_id)+'</div><div class="c-po">'+(lc.next_po_date?'📦 '+fd(lc.next_po_date):'<span class="dim">no PO</span>')+'</div>'
    :'<span class="dim">—</span>';
  var avail_cls=i.available_today>0?'pos':i.available_today<0?'neg':'dim';
  var main='<tr class="'+(isOpen?'expanded':'')+'">'+
    '<td><span class="sku-code">'+esc(i.item_name)+'</span><span class="sku-name" title="'+esc(i.item_display_name)+'">'+esc(i.item_display_name||i.item_name)+'</span></td>'+
    '<td><span class="cls-pill">'+esc(i.item_class||'—')+'</span></td>'+
    '<td><span class="badge '+i.status+'">'+sl(i.status)+'</span></td>'+
    '<td class="r '+avail_cls+'">'+i.available_today+'</td>'+
    '<td class="r muted">'+i.open_demand_today+'</td>'+
    '<td class="r dim">'+i.max_buildable_today+'</td>'+
    '<td>'+nd+'</td>'+
    '<td class="r">'+nq+'</td>'+
    '<td>'+ch+'</td>'+
    '<td><button class="xbtn'+(isOpen?' open':'')+'" onclick="toggle(\''+i.item_id+'\')" title="'+(isOpen?'Collapse':'Expand')+'">'+(isOpen?'▲':'▼')+'</button></td>'+
    '</tr>';
  if(!isOpen)return main;
  var stairs=i.availability_staircase||[];
  var mx=Math.max.apply(null,stairs.map(function(s){return s.net_available;}));if(mx<1)mx=1;
  var sc=stairs.map(function(s){
    var bw=Math.round(s.net_available/mx*100);
    var lcn=(s.limiting_components||[])[0];
    return'<tr>'+
      '<td>'+fd(s.display_date)+'</td>'+
      '<td>'+s.buildable+'</td>'+
      '<td>'+s.cumulative_demand+'</td>'+
      '<td class="'+(s.net_available>0?'np':'nz')+'">'+s.net_available+'<div class="bar-wrap"><div class="bar-fill" style="width:'+bw+'%"></div></div></td>'+
      '<td class="dim">'+(lcn?esc(lcn.item_id):'—')+'</td>'+
      '</tr>';
  }).join('');
  var detail='<tr class="detail-row"><td class="detail-cell" colspan="10">'+
    '<div class="sc-title">Availability staircase · '+stairs.length+' step'+(stairs.length!==1?'s':'')+'</div>'+
    '<table class="sc-table"><thead><tr>'+
    '<th>Date (+pad)</th><th>Buildable</th><th>Cum. Demand</th><th>Net Available</th><th>Limiting item</th>'+
    '</tr></thead><tbody>'+sc+'</tbody></table>'+
    '</td></tr>';
  return main+detail;
}

function toggle(id){
  if(open_.has(id))open_.delete(id);else open_.add(id);
  render();
}

function sl(s){
  return{in_stock:'In Stock',out_of_stock:'Out of Stock',incoming:'Incoming',embargoed:'Embargoed',partial:'Partial'}[s]||s;
}
function fd(d){
  if(!d)return'—';
  var p=d.split('-');
  if(p.length===3){
    var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return parseInt(p[2])+' '+mo[parseInt(p[1])-1]+' '+p[0];
  }
  return d;
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

boot();
</script>
</body>
</html>
